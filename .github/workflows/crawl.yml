name: 抓取热榜

on:
  schedule:
    # 每小时第 23 分钟尝试一次。GitHub 的定时任务常被跳过或推迟（整点前后最严重），
    # 所以避开整点、提高频率；出简报前 Codex 还会用 tools/refresh.sh 手动补抓一次
    - cron: "23 * * * *"
  workflow_dispatch: # 允许在 Actions 页面手动运行

permissions:
  contents: write # 抓完要把数据提交回仓库

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取
        run: python crawl.py

      - name: 提交数据
        run: |
          git config user.name "hot-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "数据：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
